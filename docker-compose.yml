services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: imsr
      POSTGRES_PASSWORD: imsr
      POSTGRES_DB: imsr_pulmonology
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://imsr:imsr@postgres:5432/imsr_pulmonology
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
